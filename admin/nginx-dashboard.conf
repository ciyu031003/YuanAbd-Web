# dashboard.pc-fixboxs.yuanabd.cn -- 内容后台（管理后台系统）
#
# 部署位置：/etc/nginx/sites-available/fixboxs-dashboard
# 启用方式：ln -sf /etc/nginx/sites-available/fixboxs-dashboard /etc/nginx/sites-enabled/
#
# 后台是唯一具备写入能力的组件，因此这里的策略比静态站更严：
#   · 仅允许 HTTPS；HTTP 一律 301 跳转
#   · 不透传任何来自外部的「信任」头（X-Forwarded-* 由本层重写）
#   · 禁止访问 .git / .env / 源文件 / 依赖清单
#   · 不做任何静态缓存（后台页面必须实时）
#
# 语法提示：本机 nginx 为 1.24.0，**不支持** `http2 on;`（该写法需 1.25.1+），
#           因此沿用 `listen 443 ssl http2;`。
#
# 证书：由 certbot 签发（certbot certonly --nginx -d dashboard.pc-fixboxs.yuanabd.cn），
#       续期由 certbot 的 systemd timer 自动完成，无需手工干预。

server {
    listen 80;
    listen [::]:80;
    server_name dashboard.pc-fixboxs.yuanabd.cn;

    # 保留 ACME 校验路径，保证自动续期可用
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dashboard.pc-fixboxs.yuanabd.cn;

    ssl_certificate     /etc/letsencrypt/live/dashboard.pc-fixboxs.yuanabd.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.pc-fixboxs.yuanabd.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 后台全部请求转给后台服务（仅监听宿主回环）
    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;

        # 重写转发头：不信任客户端传进来的值
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # 后台响应不缓存
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        client_max_body_size 8m;
    }

    # 禁止探测常见敏感路径
    location ~ /\.(?!well-known)  { deny all; }
    location ~* \.(env|sql|bak|log|ini|conf)$ { deny all; }
    location ~* /(package\.json|package-lock\.json|docker-compose\.yml|Dockerfile)$ { deny all; }

    access_log /var/log/nginx/fixboxs-dashboard.access.log;
    error_log  /var/log/nginx/fixboxs-dashboard.error.log;
}
